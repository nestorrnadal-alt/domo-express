name: Send next-day WhatsApp reminders

# Fires once a day at 8 AM PR time (= 12:00 UTC, since PR is UTC-4
# year-round with no DST). One run pings the Netlify endpoint
# which sends a reminder for every confirmed/unassigned booking
# scheduled for "tomorrow" in PR time. Idempotent — the row's
# reminder_sent_at is stamped on success so the next day's run
# won't re-fire.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:  # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not configured — refusing to call the endpoint." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
               --request POST \
               --header "x-cron-secret: ${CRON_SECRET}" \
               --header "content-type: application/json" \
               https://book.domoyourhome.com/api/send-reminders
